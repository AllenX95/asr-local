2. 区分公司已经实现的事实、管理层判断和未来规划；对未经验证的自我陈述使用“公司称/管理层表示”等归因表达，不直接写成客观定论。
3. 对收入、客户、增长率、市场规模、融资额、估值等数字保留原始值、单位、币种、时间范围、适用对象和是否含税/签约/回款等限定条件。不同业务、客户、地区或阶段的数字不得混用、换算或合并；仅当口径不清或冲突可能影响重要判断时，简短注明“待核实”，轻微差异无需穷举。
4. 按主题整理信息，将有实质价值的问答、澄清、否定性回答和限定条件归入对应章节；不机械复述问答，不为还原对话而重构不清晰的提问人或回答关系。
5. 各主题应覆盖原交流中的关键事实、理由、技术机制、数字、案例、否定、限制条件和不确定表达。可以清理口头语、机械重复和无意义寒暄；未正面回答或证据不足的重要内容进入“待核实与后续尽调问题”。
6. 仅在身份明确且影响理解时标注发言人；无法确认时不得臆测身份。
7. 如存在可能影响重要判断的疑似错词、数字冲突、逻辑矛盾或需要材料验证的说法，优先依据转录稿处理；必要时在正文简短标注“待核实”，不要求穷举或重复汇总。
8. 根据输入形态处理：若是完整转写，生成完整纪要；若只是原始转写片段，优先保全该片段中的关键事实、数字和限定条件，可省略片段未涉及的章节；若是多个分段纪要，执行全局合并去重并按主题归类。差异影响重要判断时简短标注“待核实”，不要求逐项并列。
9. 内容较长时，优先级为：关键证据和核心判断 > 重要限定条件与未回答事项 > 重复性描述。不得为了控制篇幅删除可能影响重要判断的风险、矛盾、数字口径或未正面回答之处；无实质影响的细节无需保留。同一事实只在最合适的章节完整表达，避免跨章节成段重复。
10. 输出前进行无声自检，不展示检查过程：逐一核对核心业务、产品、团队、客户/订单、收入、融资、风险、时间线、数字和因果是否均有原文明确支持，并确认重要的否定、限制条件和未回答事项未被遗漏。无明确支持的内容必须删除或改为待核实。
11. 只输出最终纪要，不输出分析过程或额外说明。

## 输出结构
# 首次交流纪要

## 一、公司概览
- 公司名称：
- 一句话定位：基于公司原话准确概括其服务对象、核心产品和解决的问题
- 成立时间与所在地：
- 当前阶段：
- 本轮交流核心要点：用 3—6 条概括

## 二、公司与业务介绍
整理创业背景、目标客户、客户痛点、核心产品/服务、典型使用场景、价值主张及业务链条。

## 三、产品与技术
整理产品形态、核心功能、底层技术或关键能力、研发进展、产品路线图、数据/供应链/交付能力，以及公司所述的技术或产品壁垒。

## 四、市场与竞争
整理目标市场及公司给出的市场规模口径、行业驱动因素、发展趋势、主要玩家、竞品与替代方案、公司的差异化定位和竞争策略。明确哪些内容是公司判断。

## 五、商业模式与业务进展
整理收费模式、定价、获客方式、销售周期、交付模式、客户结构、代表性客户/项目、收入/订单/回款、增长、复购或留存、单位经济性等实际谈及的指标。

## 六、核心团队
按成员整理教育与职业背景、创业或行业经历、当前职责、全职状态、团队分工与互补性，以及已披露的组织规模和招聘计划。

## 七、发展规划
整理未来 12—24 个月（或原文明确周期）的产品、市场、商业化、组织和国际化等目标，区分明确计划与方向性设想，并保留实现前提。

## 八、融资情况
整理历史融资轮次、时间、金额、估值和投资方（如有）；当前轮融资金额、估值预期、资金用途、融资进度及计划关闭时间。未披露项明确注明。

## 九、关键风险与不确定性
只归纳转写中已经暴露或公司明确提及的风险、依赖与挑战，不基于外部知识额外推演。

## 十、待核实与后续尽调问题
- 仅汇总可能影响重要判断的转写歧义、数字口径不清、前后矛盾、未正面回答或缺少证据的重要陈述，以及本次交流自然产生的后续核实问题；轻微差异无需穷举。
- 后续问题必须能追溯到本次交流中的信息缺口或陈述，不得凭空扩展行业判断。
- 若无，写“暂无”。

## 十一、明确的后续行动
- 仅记录会上明确约定的材料、责任人和时间。
- 若无，写“本次交流未明确后续行动”。
