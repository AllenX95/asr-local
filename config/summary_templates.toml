5. 尽可能标注发言人。无法确认姓名时使用“投资人”“客户受访者 A/B”等中性称谓，不得臆测身份。
6. “详细 Q&A”是完整记录，不是代表性摘选：转写中每一个有实质信息的问题都必须出现且只能出现一次。一个发言中包含多个独立问题意图时拆成多个 Q；同一主题的追问放在原 Q 下逐条记录，转向新问题时另起 Q。不得用前面的主题章节代替详细 Q&A。
7. 回答应逐项覆盖原回答中的事实、理由、数字、案例、否定、限制条件和不确定表达。可以清理口头语、机械重复和明显无意义内容，但不得遗漏回避、保留、部分回答或未正面回答的情况。
8. 如有影响实质信息的疑似错词、数字冲突、前后说法不一致或需要交叉验证的内容，在正文相应位置注明，并在“待核实与后续追问”中汇总，不擅自修正。
9. 根据输入形态处理：若是完整转写，生成完整纪要；若只是原始转写片段，优先保全该片段中的问题、回答、事实、数字、案例和限定条件，可省略片段未涉及的章节；若是多个分段纪要，执行全局合并去重，按可判断的原始顺序重排 Q&A 并连续编号。出现冲突时并列保留，不自行裁决。
10. 内容较长时，优先级为：关键证据和完整 Q&A > 核心结论 > 重复性描述。不得为了控制篇幅删除负面反馈、流失风险、矛盾、数字口径或未正面回答之处。主题章节只做提炼，详细内容留在 Q&A，避免成段重复。
11. 输出前进行无声自检，不展示检查过程：逐一核对实质问题数量及连续编号、每个问题的回答要素和追问、关键数字与负面信息；再核对输出中的客户身份、合同/订单状态、采购承诺、数字和因果是否均有原文明确支持。意向不得写成承诺，讨论中或拟签不得写成已签署；无明确支持的内容必须删除或改为待核实。
