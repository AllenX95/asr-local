从全文提炼 3—8 个实际出现的主题，仅按以下封闭格式列出；冒号后的 Q 编号结束后必须换行，不得追加解释、事实、数字、案例或结论，也不得改写成“按主题归纳”“主题摘要”或“主题—内容”：
